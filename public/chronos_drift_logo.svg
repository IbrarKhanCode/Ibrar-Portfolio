<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Chronos Drift logo">
  <defs>
    <linearGradient id="cd-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="cd-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b1120"/>
  <circle cx="32" cy="32" r="24" fill="url(#cd-glow)"/>
  <!-- rewind ring -->
  <path d="M44 32a12 12 0 1 1-9.6-11.74" fill="none" stroke="url(#cd-grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- arrowhead showing rewind direction -->
  <path d="M34.4 17.6 30.8 13l5.4-1.8" fill="none" stroke="url(#cd-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- clock hand -->
  <line x1="32" y1="32" x2="32" y2="22" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="40" y2="36" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.4" fill="#e2e8f0"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>